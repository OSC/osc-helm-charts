apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Values.kubeSummary.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-summary-exporter.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "kube-summary-exporter.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNamespaces:
      - {{ .Release.Namespace }}
  endpoints:
  - port: {{ .Values.kubeSummary.name }}
    interval: 60s
    path: /metrics
