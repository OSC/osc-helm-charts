apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "prometheus.fullname" . }}-test-blackbox-exporter"
  labels:
    {{- include "prometheus.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['-O-','-S','{{ index .Values "prometheus-blackbox-exporter" "fullnameOverride" }}:{{ index .Values "prometheus-blackbox-exporter" "service" "port" }}']
  restartPolicy: Never
