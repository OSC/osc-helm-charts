apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: kube-summary
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "prometheus.labels" . | nindent 4 }}
spec:
  jobName: kube-summary
  kubernetesSDConfigs:
    - role: Node
  scrapeClass: kubernetes
  scheme: https
  scrapeInterval: 15s
  scrapeTimeout: 10s
  relabelings:
    - sourceLabels: [__meta_kubernetes_node_name]
      regex: (.+)
      targetLabel: __metrics_path__
      replacement: /node/${1}
    - targetLabel: __address__
      replacement: {{ .Values.kubeSummary.name }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.kubeSummary.service.port }}
    - action: labelmap
      regex: __meta_kubernetes_node_label_(.+)
    - sourceLabels: [__meta_kubernetes_node_name]
      regex: '(.+)'
      replacement: '$1'
      targetLabel: host
    - sourceLabels: [host]
      targetLabel: node
    - regex: "cpu_.+"
      action: labeldrop
    - regex: "cpumanager"
      action: labeldrop
    - regex: "host_model_.+"
      action: labeldrop
    - regex: "(feature|hyperv|scheduling)_node_.+"
      action: labeldrop
    - regex: "machine_type_.+"
      action: labeldrop
    - regex: "kubevirt_io_.+"
      action: labeldrop
    - regex: "nvidia_com_.+"
      action: labeldrop
    - regex: "network_nvidia_com_.+"
      action: labeldrop
    - regex: "cluster"
      action: labeldrop
