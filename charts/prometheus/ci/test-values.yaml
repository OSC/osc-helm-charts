global:
  imagePullSecret:
    password: OSC-IMAGE-PULL-PASSWORD
  ingress:
    host: test.example.com
  storageClass: standard

kube-prometheus-stack:
  prometheusOperator:
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 250m
        memory: 128Mi
  prometheus:
    prometheusSpec:
      resources:
        limits:
          cpu: 1
          memory: 1Gi
        requests:
          cpu: 500m
          memory: 256Mi
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 1Gi

prometheus-pushgateway:
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 64Mi
  persistentVolume:
    enabled: true
    accessModes:
      - ReadWriteOnce
    storageClass: standard

sslExporter:
  rbac:
    create: true

kube-state-metrics:
  collectors:
    - nodes
    - pods
    - namespaces
    - jobs
  metricLabelsAllowlist:
    - pods=[account,job,cluster,osc.edu/cluster,receiver,osc.edu/role]
    - jobs=[osc.edu/role]
    - nodes=[osc.edu/cluster,osc.edu/role,nvidia.com/gpu.product,nvidia.com/gpu.count]

kubeSummary:
  resources:
    limits:
      cpu: 250m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 64Mi
