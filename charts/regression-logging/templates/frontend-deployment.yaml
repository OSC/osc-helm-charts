{{- $fullName := include "regression-logging.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}-frontend
  labels:
    {{- include "regression-logging.labels" . | nindent 4 }}
    component: frontend
    '{{ include "osc.common.serviceAccountKey" . }}': '{{ include "osc.common.serviceAccountValue" . }}'
    receiver: '{{ .Values.global.alert.receiver }}'
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "regression-logging.selectorLabels" . | nindent 6 }}
      component: frontend
  template:
    metadata:
      labels:
        {{- include "regression-logging.selectorLabels" . | nindent 8 }}
        component: frontend
        '{{ include "osc.common.serviceAccountKey" . }}': '{{ include "osc.common.serviceAccountValue" . }}'
        receiver: '{{ .Values.global.alert.receiver }}'
    spec:
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecret.name }}
      securityContext:
        {{- toYaml .Values.frontend.podSecurityContext | nindent 8 }}
      containers:
        - name: frontend
          image: {{ include "regression-logging.image" (dict "imageRoot" .Values.frontend.image "global" .Values.global) }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: {{ .Values.frontend.service.port }}
          volumeMounts:
            - name: config-volume
              mountPath: /usr/share/nginx/html/config.json
              subPath: config.json
              readOnly: true
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.frontend.securityContext | nindent 12 }}
      nodeSelector:
        '{{ include "osc.common.nodeSelectorRoleKey" . }}': ''
      volumes:
        - name: config-volume
          secret:
            secretName: {{ include "regression-logging.fullname" . }}-api-key
            items:
              - key: config.json
                path: config.json
