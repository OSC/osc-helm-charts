---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "regression-logging.fullname" . }}-api-key
  labels:
    {{- include "regression-logging.labels" . | nindent 4 }}
type: Opaque
data:
  api-key: {{ required "API Key is required" .Values.backend.apiKey | b64enc }}
  config.json: {{ printf "{\n  \"apiKey\": \"%s\"\n}" .Values.backend.apiKey | b64enc }}
