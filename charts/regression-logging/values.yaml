global:
  imageRegistry: docker-registry.osc.edu
  imagePullSecret:
    name: osc-registry
    # -- OSC registry password
    # @default -- **required**
    password:
  oscServiceAccount: hpcsa
  storageClass: local-ess
  ingress:
    host: ""
    hostAlias: ""
  maintenanceGroups:
    - sappstf
  portforwardGroups:
    - oscstaff
  portforwardServiceAccounts:
    - name: sciappstest
      namespace: sciappstest
  alert:
    receiver: sciapps
  fileset: PZS0530

database:
  mongodb:
    enable: true
    backup:
      cronjob:
        annotations:
          osc.edu/fileset: '{{ .Values.global.fileset }}'
    persistence:
      enabled: true
      annotations:
        osc.edu/fileset: '{{ .Values.global.fileset }}'
      name: datadir
      size: 8Gi
      storageClass: '{{ .Values.global.storageClass }}'
      mountPath: /bitnami/mongodb
    extraVolumes: []
    extraVolumeMounts: []
    initContainers: []

backend:
  image:
    repository: kubernetes/barrt/backend
    tag: v0.1.0
    pullPolicy: IfNotPresent
  replicaCount: 1
  port: 8000
  service:
    type: ClusterIP
    port: 8000
  resources:
    limits:
      cpu: 4
      memory: 8Gi
    requests:
      cpu: 1
      memory: 1Gi

frontend:
  image:
    repository: kubernetes/barrt/frontend
    tag: v0.1.0
    pullPolicy: IfNotPresent
  replicaCount: 1
  port: 80
  service:
    type: ClusterIP
    port: 8080
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-buffer-size: 16k
      nginx.ingress.kubernetes.io/server-alias: '{{ .Values.global.ingress.hostAlias }}'
    host: '{{ required "Ingress host must be defined in the global settings" .Values.global.ingress.host }}'
    tls:
      - hosts:
        - '{{ required "Ingress host must be defined in the global settings" .Values.global.ingress.host }}'
        - '{{ required "Ingress hostAlias must be defined in the global settings" .Values.global.ingress.hostAlias }}'
        secretName: regression-logging-frontend
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
