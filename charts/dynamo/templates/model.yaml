{{- range $name, $model := .Values.global.models | required "models must be defined" }}
{{- $image := $model.image | default (include "dynamo.image" $) }}
{{- $modelName := $model.alias | default $model.model }}
{{- $kvRouting := $model.kvRouting | default false }}
{{- $frontend := $model.frontend | default dict }}
{{- $frontendImage := $frontend.image | default $image }}
{{- $frontendImagePullPolicy := $frontend.pullPolicy | default $model.pullPolicy | default $.Values.image.pullPolicy }}
{{- $decode := $model.decode | default dict }}
{{- $decodeImage := $decode.image | default $image }}
{{- $decodeImagePullPolicy := $decode.pullPolicy | default $model.pullPolicy | default $.Values.image.pullPolicy }}
{{- $decodeGPUs := $decode.gpu | default 1 | int }}
{{- $decodeGPUType := $decode.gpuType | default $.Values.defaultGpuType }}
{{- $decodeNodes := $decode.nodes | default 1 | int }}
{{- $decodeScaling := $decode.scaling | default $model.scaling | default dict }}
{{- $prefill := $model.prefill | default dict }}
{{- $prefillImage := $prefill.image | default $image }}
{{- $prefillImagePullPolicy := $prefill.pullPolicy | default $model.pullPolicy | default $.Values.image.pullPolicy }}
{{- $prefillGPUs := $prefill.gpu | default 1 | int }}
{{- $prefillGPUType := $prefill.gpuType | default $.Values.defaultGpuType }}
{{- $prefillNodes := $prefill.nodes | default 1 | int }}
{{- $prefillScaling := $prefill.scaling | default $model.scaling | default dict }}
{{- $disagg := $model.disagg | default false }}
{{- $decodekvTransferConfig := dict "engine_id" (printf "vllm-engine-decode-%s" $name) }}
{{- $result := merge $decodekvTransferConfig $.Values.kvTransferConfig  }}
{{- $prefillkvTransferConfig := dict "engine_id" (printf "vllm-engine-prefill-%s" $name) }}
{{- $result := merge $prefillkvTransferConfig $.Values.kvTransferConfig  }}
{{- $namespace := printf "%s-%s" $.Release.Namespace $name }}
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: {{ $name }}-frontend
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "dynamo.labels" $ | nindent 4 }}
spec:
  components:
    - name: Frontend
      runtimeVersionOverride: {{ include "dynamo.runtime.version" $ }}
      type: frontend
      scalingAdapter:
        enabled: true
      podTemplate:
      {{- $keepalive := false }}
      {{- if and (or (gt (int $decodeScaling.minReplicas) 0) (not $decodeScaling)) (or (gt $decodeNodes 1) (gt $prefillNodes 1)) }}
        {{- $keepalive = true }}
        metadata:
          annotations:
            checksum/keepalive: {{ include "dynamo.keepalive.content" $ | sha256sum }}
      {{- end }}
        spec:
          initContainers:
            - name: hf-wait
              image: {{ $.Values.init.image.repository }}:{{ $.Values.init.image.tag }}
              imagePullPolicy: {{ $.Values.init.image.pullPolicy }}
              command:
              - /bin/bash
              - /scripts/hf-wait.sh
              - {{ $name }}
              resources:
              {{- with $.Values.init.resources }}
                {{- toYaml . | nindent 16 }}
              {{- end }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
                privileged: false
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          {{- if $keepalive }}
            - name: keepalive
              image: {{ $.Values.init.image.repository }}:{{ $.Values.init.image.tag }}
              imagePullPolicy: {{ $.Values.init.image.pullPolicy }}
              restartPolicy: Always
              command:
              - /bin/bash
              - /scripts/keepalive.sh
              - {{ $modelName }}
              resources:
              {{- with $.Values.init.resources }}
                {{- toYaml . | nindent 16 }}
              {{- end }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
                privileged: false
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          {{- end }}
        {{- /* if or $decodeScaling $prefillScaling */}}
        {{- if false }}
            - name: scale-up-workers
              image: {{ $.Values.init.image.repository }}:{{ $.Values.init.image.tag }}
              imagePullPolicy: {{ $.Values.init.image.pullPolicy }}
              command:
              - /bin/bash
              - -c
              - |
                set -x
              {{- if $decodeScaling }}
                if kubectl get scaledobject {{ $name }}-vllmdecodeworker-scaler -n {{ $.Release.Namespace }}; then
                  echo "Scaling scaledobject/{{ $name }}-vllmdecodeworker-scaler"
                  kubectl annotate scaledobject {{ $name }}-vllmdecodeworker-scaler autoscaling.keda.sh/paused=true autoscaling.keda.sh/paused-replicas=1 -n {{ $.Release.Namespace }} --overwrite
                else
                  echo "scaledobject/{{ $name }}-vllmdecodeworker-scaler not found, skipping"
                fi
              {{- end }}
              {{- if $prefillScaling }}
                if kubectl get scaledobject {{ $name }}-vllmprefillworker-scaler -n {{ $.Release.Namespace }}; then
                  echo "Scaling scaledobject/{{ $name }}-vllmprefillworker-scaler"
                  kubectl annotate scaledobject {{ $name }}-vllmprefillworker-scaler autoscaling.keda.sh/paused=true autoscaling.keda.sh/paused-replicas=1 -n {{ $.Release.Namespace }} --overwrite
                else
                  echo "scaledobject/{{ $name }}-vllmprefillworker-scaler not found, skipping"
                fi
              {{- end }}
                sleep 5
                kubectl annotate scaledobject {{ $name }}-vllmdecodeworker-scaler autoscaling.keda.sh/paused-replicas- autoscaling.keda.sh/paused- -n {{ $.Release.Namespace }}
                kubectl annotate scaledobject {{ $name }}-vllmprefillworker-scaler autoscaling.keda.sh/paused-replicas- autoscaling.keda.sh/paused- -n {{ $.Release.Namespace }}
                exit 0
              resources:
              {{- with $.Values.init.resources }}
                {{- toYaml . | nindent 16 }}
              {{- end }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
                privileged: false
        {{- end }}
          containers:
            - name: main
              image: {{ $frontendImage | quote }}
              imagePullPolicy: {{ $frontendImagePullPolicy }}
              args:
                - -m
                - dynamo.frontend
              {{- if $kvRouting }}
                - --router-mode
                - kv
              {{- end }}
                - --model-name
                - {{ $model.alias | default $model.model | quote }}
              {{- range $frontend.args | default list }}
                - {{ . | quote }}
              {{- end }}
              envFrom:
                - secretRef:
                    name: {{ $.Values.hfToken.name }}
              env:
                - name: DYN_NAMESPACE
                  value: {{ $namespace }}
                - name: DYNAMO_NAMESPACE
                  value: {{ $namespace }}
              {{- with $.Values.frontendEnv }}
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- with $frontend.env | default list }}
                {{- toYaml . | nindent 16 }}
              {{- end }}
              resources:
                limits:
                  cpu: {{ $frontend.cpu | default $.Values.frontend.resources.limits.cpu | quote }}
                  memory: {{ $frontend.memory | default $.Values.frontend.resources.limits.memory | quote }}
                requests:
                  cpu: {{ $frontend.cpu | default $.Values.frontend.resources.requests.cpu | quote }}
                  memory: {{ $frontend.memory | default $.Values.frontend.resources.requests.memory | quote }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
                privileged: false
              volumeMounts:
                - name: {{ $.Values.modelCache.name }}
                  mountPath: {{ $.Values.modelCache.path }}
          nodeSelector:
            '{{ include "osc.common.nodeSelectorRoleKey" $ }}': ""
          {{- if $.Values.priorityClassName }}
          priorityClassName: {{ $.Values.priorityClassName | quote }}
          {{- end }}
          volumes:
            - name: scripts
              configMap:
                name: {{ $.Values.configMap.scripts.name }}
            - name: {{ $.Values.modelCache.name }}
              persistentVolumeClaim:
                claimName: {{ $.Values.modelCache.name }}
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "dynamo.labels" $ | nindent 4 }}
spec:
  annotations:
    prometheus.io/probe_skip: "true"
  components:
    {{- if $disagg }}
    - name: decode
      type: decode
    {{- else }}
    - name: worker
      type: worker
    {{- end }}
      runtimeVersionOverride: {{ include "dynamo.runtime.version" $ }}
    {{- if $decodeScaling }}
      scalingAdapter:
        enabled: true
    {{- else }}
      replicas: {{ $decode.replicas | default 1 }}
    {{- end }}
    {{- if gt $decodeNodes 1 }}
      multinode:
        nodeCount: {{ $decodeNodes }}
    {{- end }}
      sharedMemorySize: {{ $decode.sharedMemorySize | default $model.sharedMemorySize | default $.Values.sharedMemorySize }}
      compilationCache:
        mountPath: {{ $.Values.compilationCache.path }}
        pvcName: {{ $.Values.compilationCache.name }}
      podTemplate:
      {{- if and (gt $decodeNodes 1) (eq $model.forceRay true) }}
        metadata:
          annotations:
            nvidia.com/vllm-distributed-executor-backend: ray
      {{- end }}
        spec:
          initContainers:
            - name: create-subpath
              image: {{ $.Values.init.image.repository }}:{{ $.Values.init.image.tag }}
              imagePullPolicy: {{ $.Values.init.image.pullPolicy }}
              command:
                - /bin/bash
                - -c
              args:
                - |
                  set -x
                  mkdir -p {{ $.Values.compilationCache.path }}/{{ include "dynamo.runtime.version" $ }}
                  mkdir -p {{ $.Values.tritonCache.path }}/{{ include "dynamo.runtime.version" $ }}
              resources:
                {{- with $.Values.init.resources }}
                  {{- toYaml . | nindent 16 }}
                {{- end }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
                privileged: false
              workingDir: /home/dynamo
              volumeMounts:
                - name: {{ $.Values.compilationCache.name }}
                  mountPath: {{ $.Values.compilationCache.path }}
                - name: {{ $.Values.tritonCache.name }}
                  mountPath: {{ $.Values.tritonCache.path }}
            - name: hf-wait
              image: {{ $.Values.init.image.repository }}:{{ $.Values.init.image.tag }}
              imagePullPolicy: {{ $.Values.init.image.pullPolicy }}
              command:
              - /bin/bash
              - /scripts/hf-wait.sh
              - {{ $name }}
              resources:
              {{- with $.Values.init.resources }}
                {{- toYaml . | nindent 16 }}
              {{- end }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
                privileged: false
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          containers:
            - name: main
              image: {{ $decodeImage | quote }}
              imagePullPolicy: {{ $decodeImagePullPolicy }}
              command:
                - python3
                - -m
                - dynamo.vllm
              args:
                - --model
                - {{ required "model name is required" $model.model }}
              {{- if $model.alias }}
                - --served-model-name
                - {{ $model.alias }}
              {{- end }}
              {{- if or (gt $decodeGPUs 1) (gt $decodeNodes 1) }}
                - --tensor-parallel-size
                - {{ mul $decodeNodes $decodeGPUs | quote }}
              {{- end }}
              {{- if $disagg }}
                - --disaggregation-mode
                - decode
                - --kv-transfer-config
                - '{{ $decodekvTransferConfig | toJson }}'
              {{- end }}
              {{- range $.Values.workerArgs }}
                - {{ . | quote }}
              {{- end }}
              {{- range $decode.args | default list }}
                - {{ . | quote }}
              {{- end }}
              {{- range $model.args | default list }}
                - {{ . | quote }}
              {{- end }}
              envFrom:
                - secretRef:
                    name: {{ $.Values.hfToken.name }}
              resources:
                limits:
                  {{ $decodeGPUType }}: {{ $decodeGPUs }}
                  {{ $.Values.rdmaResource }}: {{ $decodeGPUs }}
                  cpu: {{ $decode.cpu | default 2 | quote }}
                  memory: {{ $decode.memory | default "4Gi" | quote }}
                requests:
                  {{ $decodeGPUType }}: {{ $decodeGPUs }}
                  {{ $.Values.rdmaResource }}: {{ $decodeGPUs }}
                  cpu: {{ $decode.cpu | default 2 | quote }}
                  memory: {{ $decode.memory | default "4Gi" | quote }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                {{- if $disagg }}
                  add:
                    - IPC_LOCK
                    - SYS_RESOURCE
                {{- else }}
                  drop:
                    - ALL
                {{- end }}
                seccompProfile:
                  type: RuntimeDefault
                privileged: false
              workingDir: /home/dynamo
              volumeMounts:
                - name: {{ $.Values.compilationCache.name }}
                  mountPath: {{ $.Values.compilationCache.path }}
                  subPath: {{ include "dynamo.runtime.version" $ }}
                - name: {{ $.Values.tritonCache.name }}
                  mountPath: {{ $.Values.tritonCache.path }}
                  subPath: {{ include "dynamo.runtime.version" $ }}
                - name: {{ $.Values.modelCache.name }}
                  mountPath: {{ $.Values.modelCache.path }}
              env:
              {{- with $.Values.workerEnv }}
                {{- tpl (toYaml .) $ | nindent 16 }}
              {{- end }}
            {{- if $disagg }}
              {{- with $.Values.disaggEnv }}
                {{- toYaml . | nindent 16 }}
              {{- end }}
            {{- end }}
              {{- with $model.env | default list }}
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- with $decode.env | default list }}
                {{- toYaml . | nindent 16 }}
              {{- end }}
          {{- if $.Values.priorityClassName }}
          priorityClassName: {{ $.Values.priorityClassName | quote }}
          {{- end }}
          volumes:
            - name: scripts
              configMap:
                name: {{ $.Values.configMap.scripts.name }}
            - name: {{ $.Values.tritonCache.name }}
              persistentVolumeClaim:
                claimName: {{ $.Values.tritonCache.name }}
            - name: {{ $.Values.modelCache.name }}
              persistentVolumeClaim:
                claimName: {{ $.Values.modelCache.name }}
  {{- if $disagg }}
    - name: prefill
      runtimeVersionOverride: {{ include "dynamo.runtime.version" $ }}
      type: prefill
    {{- if $prefillScaling }}
      scalingAdapter:
        enabled: true
    {{- else }}
      replicas: {{ $prefill.replicas | default 1 }}
    {{- end }}
    {{- if gt $prefillNodes 1 }}
      multinode:
        nodeCount: {{ $prefillNodes }}
    {{- end }}
      sharedMemorySize: {{ $prefill.sharedMemorySize | default $model.sharedMemorySize | default $.Values.sharedMemorySize }}
      compilationCache:
        mountPath: {{ $.Values.compilationCache.path }}
        pvcName: {{ $.Values.compilationCache.name }}
      podTemplate:
      {{- if and (gt $prefillNodes 1) (eq $model.forceRay true) }}
        metadata:
          annotations:
            nvidia.com/vllm-distributed-executor-backend: ray
      {{- end }}
        spec:
          initContainers:
            - name: create-subpath
              image: {{ $.Values.init.image.repository }}:{{ $.Values.init.image.tag }}
              imagePullPolicy: {{ $.Values.init.image.pullPolicy }}
              command:
                - /bin/bash
                - -c
              args:
                - |
                  set -x
                  mkdir -p {{ $.Values.compilationCache.path }}/{{ include "dynamo.runtime.version" $ }}
                  mkdir -p {{ $.Values.tritonCache.path }}/{{ include "dynamo.runtime.version" $ }}
              resources:
                {{- with $.Values.init.resources }}
                  {{- toYaml . | nindent 16 }}
                {{- end }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
                privileged: false
              workingDir: /home/dynamo
              volumeMounts:
                - name: {{ $.Values.compilationCache.name }}
                  mountPath: {{ $.Values.compilationCache.path }}
                - name: {{ $.Values.tritonCache.name }}
                  mountPath: {{ $.Values.tritonCache.path }}
            - name: hf-wait
              image: {{ $.Values.init.image.repository }}:{{ $.Values.init.image.tag }}
              imagePullPolicy: {{ $.Values.init.image.pullPolicy }}
              command:
              - /bin/bash
              - /scripts/hf-wait.sh
              - {{ $name }}
              resources:
              {{- with $.Values.init.resources }}
                {{- toYaml . | nindent 16 }}
              {{- end }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
                privileged: false
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          containers:
            - name: main
              image: {{ $prefillImage | quote }}
              imagePullPolicy: {{ $prefillImagePullPolicy }}
              command:
                - python3
                - -m
                - dynamo.vllm
              args:
                - --model
                - {{ required "model name is required" $model.model }}
              {{- if $model.alias }}
                - --served-model-name
                - {{ $model.alias }}
              {{- end }}
              {{- if or (gt $prefillGPUs 1) (gt $prefillNodes 1) }}
                - --tensor-parallel-size
                - {{ mul $prefillNodes $prefillGPUs | quote }}
              {{- end }}
                - --disaggregation-mode
                - prefill
                - --kv-transfer-config
                - '{{ $prefillkvTransferConfig | toJson }}'
              {{- if $kvRouting }}
                - --kv-events-config
                - '{{ $.Values.kvEventsConfig | toJson }}'
              {{- end }}
              {{- range $.Values.workerArgs }}
                - {{ . | quote }}
              {{- end }}
              {{- range $prefill.args | default list }}
                - {{ . | quote }}
              {{- end }}
              {{- range $model.args | default list }}
                - {{ . | quote }}
              {{- end }}
              envFrom:
                - secretRef:
                    name: {{ $.Values.hfToken.name }}
              resources:
                limits:
                  {{ $prefillGPUType }}: {{ $prefillGPUs }}
                  {{ $.Values.rdmaResource }}: {{ $prefillGPUs }}
                  cpu: {{ $prefill.cpu | default 2 | quote }}
                  memory: {{ $prefill.memory | default "4Gi" | quote }}
                requests:
                  {{ $prefillGPUType }}: {{ $prefillGPUs }}
                  {{ $.Values.rdmaResource }}: {{ $prefillGPUs }}
                  cpu: {{ $prefill.cpu | default 2 | quote }}
                  memory: {{ $prefill.memory | default "4Gi" | quote }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                {{- if $disagg }}
                  add:
                    - IPC_LOCK
                    - SYS_RESOURCE
                {{- else }}
                  drop:
                    - ALL
                {{- end }}
                seccompProfile:
                  type: RuntimeDefault
                privileged: false
              workingDir: /home/dynamo
              volumeMounts:
                - name: {{ $.Values.compilationCache.name }}
                  mountPath: {{ $.Values.compilationCache.path }}
                  subPath: {{ include "dynamo.runtime.version" $ }}
                - name: {{ $.Values.tritonCache.name }}
                  mountPath: {{ $.Values.tritonCache.path }}
                  subPath: {{ include "dynamo.runtime.version" $ }}
                - name: {{ $.Values.modelCache.name }}
                  mountPath: {{ $.Values.modelCache.path }}
              env:
              {{- with $.Values.workerEnv }}
                {{- tpl (toYaml .) $ | nindent 16 }}
              {{- end }}
            {{- if $disagg }}
              {{- with $.Values.disaggEnv }}
                {{- toYaml . | nindent 16 }}
              {{- end }}
            {{- end }}
              {{- with $model.env | default list }}
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- with $prefill.env | default list }}
                {{- toYaml . | nindent 16 }}
              {{- end }}
          {{- if $.Values.priorityClassName }}
          priorityClassName: {{ $.Values.priorityClassName | quote }}
          {{- end }}
          volumes:
            - name: scripts
              configMap:
                name: {{ $.Values.configMap.scripts.name }}
            - name: {{ $.Values.tritonCache.name }}
              persistentVolumeClaim:
                claimName: {{ $.Values.tritonCache.name }}
            - name: {{ $.Values.modelCache.name }}
              persistentVolumeClaim:
                claimName: {{ $.Values.modelCache.name }}
  {{- end }}
{{- end }}
