{{- if and .Values.ingress.enabledd .Values.basicAuth.enabled (not .Values.basicAuth.existingSecretName) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.basicAuth.secretName | default (printf "%s-basic-auth-secret" .Release.Name) }}
  labels:
    {{- include "mlflow.labels" . | nindent 4 }}
type: Opaque
data:
  # Note: This is a placeholder. For production, create the secret manually:
  # htpasswd -nbC 10 <username> <password> | kubectl create secret generic <name> --from-file=htpasswd=/dev/stdin
  htpasswd: {{ printf "%s:PLACEHOLDER-CHANGE-THIS-PASSWORD" .Values.basicAuth.username | b64enc }}
{{- end -}}
