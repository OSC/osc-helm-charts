apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mlflow.fullname" . }}-app-secrets
  labels:
    {{- include "osc-mlflow.labels" . | nindent 4 }}
type: Opaque
data:
  AWS_ACCESS_KEY_ID: {{ .Values.global.minio.auth.rootUser | b64enc | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.global.minio.auth.rootPassword | b64enc | quote }}
  MLFLOW_SERVER_CORS_ALLOWED_ORIGINS: {{ printf "https://%s" .Values.global.ingress.host | b64enc | quote }}
  MLFLOW_SERVER_ALLOWED_HOSTS: {{ .Values.global.ingress.host | b64enc | quote }}
