apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-app-secrets
  labels:
    {{- include "osc-mlflow.labels" . | nindent 4 }}
type: Opaque
data:
  AWS_ACCESS_KEY_ID: {{ .Values.global.silo.user | b64enc | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.global.silo.password | b64enc | quote }}
{{- $origins := list }}
{{- $origins = append $origins (printf "https://%s" .Values.global.ingress.host) }}
{{- $origins = append $origins (printf "http://%s.%s.svc.cluster.local" .Release.Name .Release.Namespace) }}
{{- if .Values.global.ingress.hostAlias }}
{{- $origins = append $origins (printf "https://%s" .Values.global.ingress.hostAlias) }}
{{- end }}
  MLFLOW_SERVER_CORS_ALLOWED_ORIGINS: {{ $origins | join "," | b64enc | quote }}
  MLFLOW_SERVER_ALLOWED_HOSTS: {{ list .Values.global.ingress.host .Values.global.ingress.hostAlias (printf "%s.%s.svc.cluster.local" .Release.Name .Release.Namespace) | compact | join "," | b64enc | quote }}
