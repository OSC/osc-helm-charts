apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-app-secrets
  labels:
    {{- include "osc-mlflow.labels" . | nindent 4 }}
type: Opaque
data:
  AWS_ACCESS_KEY_ID: {{ .Values.global.minio.auth.rootUser | b64enc | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.global.minio.auth.rootPassword | b64enc | quote }}
  MLFLOW_SERVER_CORS_ALLOWED_ORIGINS: {{ list (ternary (printf "https://%s" .Values.global.ingress.host) "" (ne .Values.global.ingress.host "")) (ternary (printf "https://%s" .Values.global.ingress.hostAlias) "" (ne .Values.global.ingress.hostAlias "")) | compact | join "," | quote }}
  MLFLOW_SERVER_ALLOWED_HOSTS: {{ list .Values.global.ingress.host .Values.global.ingress.hostAlias | compact | join "," | b64enc | quote }}
