{{- if .Values.ingress.enabled -}}
{{- $fullName := include "mlflow.fullname" . -}}
{{- $annotations := deepCopy .Values.ingress.annotations -}}
{{- $ingressHost := .Values.global.ingress.host -}}
{{- if eq $ingressHost "" -}}
{{- $ingressHost = "chart-example.local" -}}
{{- end -}}
{{- $tlsEnabled := and .Values.global.ingress.host (ne .Values.global.ingress.host "") -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "mlflow.labels" . | nindent 4 }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if $tlsEnabled }}
  tls:
    - hosts:
        - {{ $ingressHost | quote }}
      secretName: {{ $fullName }}-cert
  {{- end }}
  rules:
    - host: {{ $ingressHost | quote }}
      http:
        paths:
          {{- range .Values.ingress.paths }}
          - path: {{ .path | default "/" }}
            pathType: {{ .pathType | default "ImplementationSpecific" }}
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: 80
          {{- end }}
{{- end }}
