apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mlflow.fullname" . }}-db-secrets
  labels:
    {{- include "mlflow.commonLabels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.database.postgresql.auth.username | b64enc | quote }}
  mlflow-password: {{ .Values.database.postgresql.auth.password | b64enc | quote }}
  postgres-password: {{ .Values.database.postgresql.auth.postgresPassword | b64enc | quote }}