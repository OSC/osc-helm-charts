apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mlflow.fullname" . }}-minio-secrets
  labels:
    {{- include "mlflow.commonLabels" . | nindent 4 }}
type: Opaque
data:
  minio-root-user: {{ .Values.minio.auth.rootUser | b64enc | quote }}
  minio-root-password: {{ .Values.minio.auth.rootPassword | b64enc | quote }}