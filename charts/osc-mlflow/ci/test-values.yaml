global:
  oscServiceAccount: nobody
  imagePullSecret:
    password: IMAGE-PULL-PASSWORD
  storageClass: standard
  ingress:
    host: test.example.com
    minio:
      api: test-api.example.com
      console: test-minio-console.example.com

database:
  postgresql:
    primary:
      persistence:
        size: 50Mi
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 200m
          memory: 256Mi
    backup:
      cronjob:
        schedule: '* * * * *'
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 200m
            memory: 128Mi
        storage:
          accessModes:
          - ReadWriteOnce

osc-minio:
  minio:
    resources:
      limits:
        cpu: 1000m
        memory: 128Mi
      requests:
        cpu: 250m
        memory: 64Mi
    persistence:
      accessModes:
      - ReadWriteOnce
      size: 50Mi
    console:
      resources:
        limits:
          cpu: 1000m
          memory: 128Mi
        requests:
          cpu: 250m
          memory: 64Mi

mlflow:
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 500m
      memory: 128Mi
