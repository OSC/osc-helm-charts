global:
  oscServiceAccount: nobody
  imagePullSecret:
    password: IMAGE-PULL-PASSWORD
  storageClass: standard
  ingress:
    host: test.example.com
    minio:
      api: test-api.example.com
      console: test-minio-console.example.com

database:
  postgresql:
    resources:
      limits:
        cpu: 1000m
        memory: 128Mi
      requests:
        cpu: 500m
        memory: 64Mi

osc-minio:
  minio:
    resources:
      limits:
        cpu: 1000m
        memory: 128Mi
      requests:
        cpu: 250m
        memory: 64Mi
    persistence:
      accessModes:
      - ReadWriteOnce
      size: 50Mi
    console:
      resources:
        limits:
          cpu: 1000m
          memory: 128Mi
        requests:
          cpu: 250m
          memory: 64Mi

mlflow:
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 500m
      memory: 128Mi
