global:
  oscServiceAccount: nobody
  imagePullSecret:
    password: IMAGE-PULL-PASSWORD
  storageClass: standard
  ingress:
    host: test.example.com
    silo:
      api: test-api.example.com
      console: test-minio-console.example.com

database:
  postgresql:
    primary:
      persistence:
        size: 50Mi
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 200m
          memory: 256Mi
    backup:
      cronjob:
        schedule: '*/5 * * * *'
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        storage:
          accessModes:
          - ReadWriteOnce

osc-silo:
  silo:
    resources:
      limits:
        cpu: 1000m
        memory: 128Mi
      requests:
        cpu: 250m
        memory: 64Mi
    makePolicyJob:
      resources:
        limits:
          cpu: 500m
          memory: 64Mi
        requests:
          cpu: 100m
          memory: 32Mi
    makeUserJob:
      resources:
        limits:
          cpu: 500m
          memory: 64Mi
        requests:
          cpu: 100m
          memory: 32Mi
    makeServiceAccountJob:
      resources:
        limits:
          cpu: 500m
          memory: 64Mi
        requests:
          cpu: 100m
          memory: 32Mi
    makeBucketJob:
      resources:
        limits:
          cpu: 500m
          memory: 64Mi
        requests:
          cpu: 100m
          memory: 32Mi
    persistence:
      accessMode: ReadWriteOnce
      size: 50Mi
    # Adding policies during CI/CD and 'ct install' causes errors for the other post-install
    # init containers, so just omit during CI/CD
    policies: []

mlflow:
  resources:
    limits:
      cpu: 4000m
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 512Mi
  initResources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 64Mi
  startupProbe:
    initialDelaySeconds: 60
