global:
  imageRegistry: docker-registry.osc.edu
  imagePullSecret:
    name: osc-registry
    # -- OSC registry password
    # @default -- **required**
    password:
  oscServiceAccount: oscchat
  storageClass: webservices-nfs-client
  ingress:
    host: ""
    hostAlias: ""
  alert:
    receiver: sciapps
  security:
    allowInsecureImages: true
  nodeSelectorRole: webservices
  debugGroups:
    - sappstf
  maintenanceGroups:
    - sappstf

database:
  # @ignored
  oscCommon:
    enable: false
  postgresql:
    # @ignored
    enable: true
    auth:
      postgresPassword: changeme-postgres
      database: mlflow
      username: mlflow
      password: changeme-mlflow
    # @ignored
    primary:
      persistence:
        annotations:
          osc.edu/fileset: '{{ .Values.global.fileset }}'
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 1Gi
#    # @ignored
#    backup:
#      cronjob:
#        annotations:
#          osc.edu/fileset: '{{ .Values.global.fileset }}'

minio:
  enable: true
  auth:
    rootUser: mlflowadmin
    rootPassword: changeme-minio
  defaultBuckets: "mlflow-artifacts"
  commonLabels:
    receiver: '{{ index .Values.global.alert.receiver }}'
  image:
    repository: kubernetes/bitnami/minio
    tag: 2025.7.23-debian-12-r5
    pullSecrets:
      - osc-registry
  persistence:
    enabled: true
    storageClass: paas-nfs-client
    size: 100Gi
    annotations:
      osc.edu/fileset: PZS0645
      helm.sh/resource-policy: keep
  service:
    type: ClusterIP
    rpcPort: 9000
    consolePort: 9001
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 1Gi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 60s
      relabelings:
      - sourceLabels: [__meta_kubernetes_service_label_receiver]
        targetLabel: receiver
  console:
    image:
      repository: kubernetes/bitnami/minio-object-browser
      tag: 2.0.2-debian-12-r3

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
  paths:
    - path: /
      pathType: ImplementationSpecific

mlflow:
  image:
    repository: docker-registry.osc.edu/kubernetes/mlflow
    tag: "v3.17.1-full"
  resources:
    requests:
      cpu: 1000m
      memory: 4Gi
    limits:
      cpu: 4000m
      memory: 16Gi
  livenessProbe:
    httpGet:
      path: /health
      port: 5000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /health
      port: 5000
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  initImages:
    dbchecker:
      repository: docker-registry.osc.edu/kubernetes/busybox
      tag: "1.38.0"
      pullPolicy: IfNotPresent
    mlflowDbMigration:
      repository: docker-registry.osc.edu/kubernetes/mlflow
      tag: "v3.17.1-full"
      pullPolicy: IfNotPresent
    iniFileInitializer:
      repository: docker-registry.osc.edu/kubernetes/busybox
      tag: "1.38.0"
      pullPolicy: IfNotPresent
  # PostgreSQL backend store configuration
  backendStore:
    #databaseMigration: false
    databaseMigration: true
    databaseConnectionCheck: true
    defaultSqlitePath: ":memory:"
    postgres:
      enabled: true
      host: "osc-mlflow-postgresql"
      port: 5432
      database: "mlflow"
      user: "mlflow"
      password: "changeme-mlflow"
      driver: "psycopg2"
  # Artifact storage configuration
  artifactRoot:
    proxiedArtifactStorage: true
    defaultArtifactRoot: "./mlruns"
    defaultArtifactsDestination: "s3://mlflow-artifacts/"
  # Environment variables for MLFlow subchart (uses extraEnvVars as object)
  extraEnvVars:
    AWS_ACCESS_KEY_ID: "mlflowadmin"
    AWS_SECRET_ACCESS_KEY: "changeme-minio"
    AWS_DEFAULT_REGION: "us-east-1"
    MLFLOW_S3_ENDPOINT_URL: "http://osc-mlflow-minio:9000"
    MLFLOW_SERVER_ALLOWED_HOSTS: "skhuvis-mlflow.k8.osc.edu"
    MLFLOW_SERVER_CORS_ALLOWED_ORIGINS: "https://skhuvis-mlflow.k8.osc.edu"
    MLFLOW_BACKEND_STORE_URI: "postgresql://mlflow:changeme-mlflow@osc-mlflow-postgresql:5432/mlflow"
    # Use MinIO for artifact storage (instead of local filesystem)
    MLFLOW_DEFAULT_ARTIFACT_ROOT: "s3://mlflow-artifacts/"
  # Enable MLflow's built-in basic authentication
  auth:
    enabled: true  # Enable MLflow basic auth
    adminUsername: admin
    adminPassword: changeme-admin
    postgres:
      enabled: true
      host: "osc-mlflow-postgresql"
      port: 5432
      database: "mlflow"
      user: "mlflow"
      password: "changeme-mlflow"
#  oidcAuth:
#    enabled: false  # Disable native OIDC
#  # Disable oauth2-proxy sidecar - using basic auth instead
#  oauth2Proxy:
#    enabled: false  # Disabled - using basic auth
