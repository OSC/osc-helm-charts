global:
  imageRegistry: docker-registry.osc.edu
  imagePullSecret:
    name: osc-registry
    # -- OSC registry password
    # @default -- **required**
    password:
  oscServiceAccount: mlflow
  storageClass: local-ess
  ingress:
    host: ""
    hostAlias: ""
    silo:
      api: ""
      console: ""
  alert:
    receiver: sciapps
  security:
    allowInsecureImages: true
  nodeSelectorRole: webservices
  fileset: PZS0645
  auth:
    enable: false
    keycloakClient:
      forceCreate: true
      config:
        webOrigins:
          - https://{{ .Values.global.ingress.host }}
          - '{{ printf "https://%s" (.Values.global.ingress.hostAlias | default .Values.global.ingress.host) }}'
  postgresql:
    auth:
      username: mlflow
      password: changeme-mlflow
      postgresPassword: changeme-postgres
      database: mlflow
  silo:
    rootUser: mlflowadmin
    rootPassword: changeme-silo
    user: mlflow
    password: changeme
    defaultBucket: "mlflow-artifacts"
  mlflow:
    auth:
      adminUsername: admin
      adminPassword: changeme-admin
      postgresql:
        username: mlflow-auth
        password: changeme-mlflow-auth
        database: mlflow-auth
  debugGroups:
    - sappstf
  maintenanceGroups:
    - sappstf

database:
  # @ignored
  oscCommon:
    enable: false
  postgresql:
    # @ignored
    enable: true
    auth:
      postgresPassword: '{{ .Values.global.postgresql.auth.postgresPassword }}'
      database: '{{ .Values.global.postgresql.database }}'
      username: '{{ .Values.global.postgresql.auth.username }}'
      password: '{{ .Values.global.postgresql.auth.password }}'
    # @ignored
    primary:
      # extraEnvVarsSecret: mlflow-auth-db-secret
      extraEnvVars:
        - name: MLFLOW_AUTH_DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: '{{ .Release.Name }}-oidc-auth-db-secret'
              key: username
        - name: MLFLOW_AUTH_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: '{{ .Release.Name }}-oidc-auth-db-secret'
              key: password
      initdb:
        scripts:
          mlflow-auth-db.sh: |
            export PGPASSWORD="$POSTGRESQL_POSTGRES_PASSWORD"
            psql -v ON_ERROR_STOP=1 -h localhost -p $POSTGRESQL_PORT_NUMBER -U postgres -d "postgres" <<-EOSQL
              CREATE USER "$MLFLOW_AUTH_DB_USERNAME" WITH PASSWORD '$MLFLOW_AUTH_DB_PASSWORD';
              CREATE DATABASE "{{ .Values.global.mlflow.auth.postgresql.database }}" OWNER "$MLFLOW_AUTH_DB_USERNAME";
              GRANT ALL PRIVILEGES ON DATABASE "{{ .Values.global.mlflow.auth.postgresql.database }}" TO "$MLFLOW_AUTH_DB_USERNAME";
            EOSQL
      persistence:
        annotations:
          osc.edu/fileset: '{{ .Values.global.fileset }}'
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 1000m
        memory: 2Gi
#    # @ignored
#    backup:
#      cronjob:
#        annotations:
#          osc.edu/fileset: '{{ .Values.global.fileset }}'

osc-silo:
  enable: true
  silo:
    fullnameOverride: osc-mlflow-silo

mlflow:
  image:
    repository: docker-registry.osc.edu/kubernetes/mlflow-tracking-server
    tag: "3.18.0-11.3.1-20261119"
  imagePullSecrets:
    - name: '{{ .Values.global.imagePullSecret.name }}'
  resources:
    requests:
      cpu: 1000m
      memory: 4Gi
    limits:
      cpu: 4000m
      memory: 16Gi
  # @ignored
  initResources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 128Mi
  # @ignored
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 5
  # @ignored
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 3
    failureThreshold: 5
  commonLabels:
    receiver: '{{ index .Values.global.alert.receiver }}'
    '{{ include "osc.common.serviceAccountKey" . }}': '{{ include "osc.common.serviceAccountValue" . }}'
  nodeSelector:
    '{{ include "osc.common.nodeSelectorRoleKey" . }}': ''
  initImages:
    dbchecker:
      repository: docker-registry.osc.edu/kubernetes/busybox
      tag: "1.38.0"
      pullPolicy: IfNotPresent
    mlflowDbMigration:
      repository: "{{ .Values.image.repository }}"
      tag: "{{ .Values.image.tag }}"
      pullPolicy: IfNotPresent
    iniFileInitializer:
      repository: "{{ .Values.initImages.dbchecker.repository }}"
      tag: "{{ .Values.initImages.dbchecker.tag }}"
      pullPolicy: IfNotPresent
  # PostgreSQL backend store configuration
  backendStore:
    databaseMigration: true
    databaseConnectionCheck: true
    defaultSqlitePath: ":memory:"
    postgres:
      enabled: true
      host: '{{ .Release.Name }}-postgresql'
      port: 5432
      database: '{{ .Values.global.postgresql.auth.database }}'
      driver: "psycopg2"
      user: '{{ .Values.global.postgresql.auth.username }}'
      password: '{{ .Values.global.postgresql.auth.password }}'
  artifactRoot:
    proxiedArtifactStorage: true
    defaultArtifactRoot: "./mlruns"
    defaultArtifactsDestination: "s3://{{ .Values.global.silo.defaultBucket }}/"
  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
      nginx.ingress.kubernetes.io/server-alias: '{{ .Values.global.ingress.hostAlias }}'
    hosts:
      - host: '{{ .Values.global.ingress.host }}'
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - secretName: osc-mlflow-cert
        hosts:
          - '{{ .Values.global.ingress.host }}'
          - '{{ .Values.global.ingress.hostAlias | default .Values.global.ingress.host }}'
  extraEnvVars:
    AWS_DEFAULT_REGION: "us-east-1"
    MLFLOW_S3_ENDPOINT_URL: "http://osc-mlflow-silo:9000"
    MLFLOW_DEFAULT_ARTIFACT_ROOT: "s3://{{ .Values.global.silo.defaultBucket }}/"
    # OIDC_DISCOVERY_URL: "https://idp.osc.edu/realms/osc/.well-known/openid-configuration"
    # OIDC_SCOPE: "openid profile email groups osc-oidc-clients"
    # OIDC_GROUPS_ATTRIBUTE: "groups"
  extraSecretNamesForEnvFrom:
    - '{{ .Release.Name }}-app-secrets'
    - '{{ tpl .Values.global.auth.keycloakClient.secret.name . }}'
  extraConfigMapNamesForEnvFrom:
    - '{{ tpl .Values.global.auth.keycloakClient.configMap.name . }}'
  # -- flask server secret key
  # @default -- **required**
  flaskServerSecretKey: changeme
  # @ignored
  oidcAuth:
    enabled: true
    existingSecret:
      name: '{{ (tpl .Values.global.auth.keycloakClient.secret.name .) }}'
      clientSecretKey: OIDC_CLIENT_SECRET
    # extraSecretNamesForEnvFrom:
    #  - '{{ .Values.global.auth.keycloakClient.secret.name }}'
    # extraConfigMapNamesForEnvFrom:
    #  - '{{ .Values.global.auth.keycloakClient.configMap.name }}'
    # discoveryUrl: https://idp.osc.edu/realms/osc/.well-known/openid-configuration
    scope: "openid profile email groups osc-oidc-clients"
    providerDisplayName: "Login to OSC"
    groupName:
      - oscall
    adminGroupName:
      - sysstf
      - sappstf
    database:
      postgres:
        enabled: true
        host: '{{ .Release.Name }}-postgresql'
        port: 5432
        database: '{{ .Values.global.mlflow.auth.postgresql.database }}'
        user: '{{ .Values.global.mlflow.auth.postgresql.username }}'
        password: '{{ .Values.global.mlflow.auth.postgresql.password }}'

# @ignored
osc-common:
  keycloakClient:
    secret:
      envVarKeys: true
      keyPrefix: OIDC_
      clientSecretKey: CLIENT_SECRET
    configMap:
      providerUrlKey: OIDC_DISCOVERY_URL
