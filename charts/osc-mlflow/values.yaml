global:
  imageRegistry: docker-registry.osc.edu
  imagePullSecret:
    name: osc-registry
    # -- OSC registry password
    # @default -- **required**
    password:
  oscServiceAccount: mlflow
  storageClass: local-ess
  ingress:
    host: ""
    hostAlias: ""
    minio:
      api: ""
      console: ""
  alert:
    receiver: sciapps
  security:
    allowInsecureImages: true
  nodeSelectorRole: webservices
  fileset: PZS0645
  postgresql:
    auth:
      username: mlflow
      password: changeme-mlflow
      postgresPassword: changeme-postgres
      database: mlflow
  minio:
    auth:
      rootUser: mlflowadmin
      rootPassword: changeme-minio
  mlflow:
    auth:
      adminUsername: admin
      adminPassword: changeme-admin
  debugGroups:
    - sappstf
  maintenanceGroups:
    - sappstf

database:
  # @ignored
  oscCommon:
    enable: false
  postgresql:
    # @ignored
    enable: true
    auth:
      postgresPassword: '{{ .Values.global.postgresql.auth.postgresPassword }}'
      database: '{{ .Values.global.postgresql.database }}'
      username: '{{ .Values.global.postgresql.auth.username }}'
      password: '{{ .Values.global.postgresql.auth.password }}'
    # @ignored
    primary:
      persistence:
        annotations:
          osc.edu/fileset: '{{ .Values.global.fileset }}'
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 1Gi
#    # @ignored
#    backup:
#      cronjob:
#        annotations:
#          osc.edu/fileset: '{{ .Values.global.fileset }}'

osc-minio:
  enable: true
  minio:
   fullnameOverride: osc-mlflow-minio
   defaultBuckets: "mlflow-artifacts"

mlflow:
  image:
    repository: docker-registry.osc.edu/kubernetes/mlflow
    tag: "v3.17.1-full"
  resources:
    requests:
      cpu: 1000m
      memory: 4Gi
    limits:
      cpu: 4000m
      memory: 16Gi
  livenessProbe:
    httpGet:
      path: /health
      port: 5000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /health
      port: 5000
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  commonLabels:
    receiver: '{{ index .Values.global.alert.receiver }}'
    '{{ include "osc.common.serviceAccountKey" . }}': '{{ include "osc.common.serviceAccountValue" . }}'
  nodeSelector:
    '{{ include "osc.common.nodeSelectorRoleKey" . }}': ''
  initImages:
    dbchecker:
      repository: docker-registry.osc.edu/kubernetes/busybox
      tag: "1.38.0"
      pullPolicy: IfNotPresent
    mlflowDbMigration:
      repository: docker-registry.osc.edu/kubernetes/mlflow
      tag: "v3.17.1-full"
      pullPolicy: IfNotPresent
    iniFileInitializer:
      repository: docker-registry.osc.edu/kubernetes/busybox
      tag: "1.38.0"
      pullPolicy: IfNotPresent
  # PostgreSQL backend store configuration
  backendStore:
    #databaseMigration: false
    databaseMigration: true
    databaseConnectionCheck: true
    defaultSqlitePath: ":memory:"
    postgres:
      enabled: true
      host: '{{ .Release.Name }}-postgresql'
      port: 5432
      database: '{{ .Values.global.postgresql.auth.database }}'
      driver: "psycopg2"
      user: '{{ .Values.global.postgresql.auth.username }}'
      password: '{{ .Values.global.postgresql.auth.password }}'
  artifactRoot:
    proxiedArtifactStorage: true
    defaultArtifactRoot: "./mlruns"
    defaultArtifactsDestination: "s3://mlflow-artifacts/"
  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    hosts:
      - host: '{{ .Values.global.ingress.host }}'
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - secretName: osc-mlflow-cert
        hosts:
          - '{{ .Values.global.ingress.host }}'
  extraEnvVars:
    AWS_DEFAULT_REGION: "us-east-1"
    MLFLOW_S3_ENDPOINT_URL: "http://osc-mlflow-minio:9000"
    MLFLOW_DEFAULT_ARTIFACT_ROOT: "s3://mlflow-artifacts/"
  extraSecretNamesForEnvFrom:
    - osc-mlflow-app-secrets
  auth:
    enabled: true
    adminUsername: '{{ .Values.global.mlflow.auth.adminUsername }}'
    adminPassword: '{{ .Values.global.mlflow.auth.adminPassword }}'
    postgres:
      enabled: true
      host: '{{ .Release.Name }}-postgresql'
      port: 5432
      database: '{{ .Values.global.postgresql.auth.database }}'
      user: '{{ .Values.global.postgresql.auth.username }}'
      password: '{{ .Values.global.postgresql.auth.password }}'
