apiVersion: v1
kind: ConfigMap
metadata:
  name: osc-open-webui-otel
  labels:
    {{- include "osc-open-webui.config.labels" . | nindent 4 }}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:
      transform/add_prefix:
        error_mode: ignore
        metric_statements:
          - context: metric
            statements:
              # Prepends "open.webui." to every metric name passing through this processor except osc metrics
              - set(metric.name, Concat(["open.webui", metric.name], ".")) where not IsMatch(metric.name, "^(osc|dynamo).*")
    exporters:
      prometheus:
        endpoint: 0.0.0.0:8889
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions:
      - health_check
      telemetry:
        logs:
          level: warn
        metrics:
          level: "normal"
          readers:
            - pull:
                exporter:
                prometheus:
                  host: "0.0.0.0"
                  port: 8888
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [transform/add_prefix, batch]
          exporters: [prometheus]
