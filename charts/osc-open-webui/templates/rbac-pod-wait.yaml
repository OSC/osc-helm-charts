---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-wait
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osc-open-webui.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/status"]
    verbs: ["get", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-wait
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osc-open-webui.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ printf "%s-sa" (index .Values "open-webui" "fullnameOverride" )}}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: pod-wait
  apiGroup: rbac.authorization.k8s.io
