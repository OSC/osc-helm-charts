global:
  # -- The service account used by OSC deployments.
  # Also pulled from global.env.<env>.serviceAccount
  oscServiceAccount: ""
  # -- The deployment's OSC environment
  environment: production
  # -- The nodeSelector role
  nodeSelectorRole: webservices
  imagePullSecret:
    # -- Create the image pull secret
    create: true
    # -- image pull secret name
    name: osc-registry
    # -- OSC registry address
    registry: docker-registry.osc.edu
    # -- The image pull secret password for database images
    # @default -- **required**
    password:
  # -- OSC registry, must match global.imagePullSecret.registry
  imageRegistry: docker-registry.osc.edu
  networkPolicy:
    # -- Create the network policy
    create: false
    # -- Labels for NetworkPolicy podSelector. Defaults to `"osc.common.selectorLabels"`
    podSelector: ~
    # Example define podSelector labels
    #  podSelector:
    #    app.kubernetes.io/name: test
    #
    # -- Labels of pods allowed to Ingress from the same namespace
    ingressAllowedPods: []
    # Example additional ingress labels
    #  ingressAllowedPods:
    #    - require: test
    #    - client: test
    #
    # @ignored
    ingressNamespace: ingress-nginx
    # @ignored
    prometheusNamespace: prometheus
  # -- Groups that debug pods
  debugGroups: []
  # -- Groups that can perform maintenance operations
  maintenanceGroups: []
  # -- Groups that are allowed to perform port forwarding
  portforwardGroups: []
  webservicesDeploy:
    # -- Create webservices deployment rolebinding
    create: true
  ingress:
    # -- Ingress host
    # @default -- **required**
    host: ""
    # -- Ingress host alias
    # @default -- **required**
    hostAlias: ""
    # -- Ingress additional hosts
    additionalHosts: []
    # -- Additional Ingress annotations for the Ingress resource
    annotations: ~
  auth:
    # @ignored
    enable: false
    # -- Additional redirect URIs
    redirectUris: []
    # @ignored
    keycloakClient:
      forceCreate: true
      # Set secret name to ensure rendered the same for osc-common and dependenc open-webui chart
      # @ignored
      secret:
        name: "{{ .Release.Name }}-auth-secret"
      # Set configmap name to ensure rendered the same for osc-common and dependenc open-webui chart
      # @ignored
      configmap:
        name: "{{ .Release.Name }}-auth-config"
    # -- Restrict access to these groups
    allowGroups: []
  alert:
    # -- The alert receiver
    receiver:
  # -- The Open WebUI secret key
  # @default -- **required**
  webui_secret_key:
  # -- Storage class for persistence
  storageClass: webservices-nfs-client
  # -- The storage fileset
  fileset:
  # @ignored
  init:
    resources:
      limits:
        cpu: 1
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 64Mi
  database:
    # -- Enable database support
    enable: false
    pool:
      # -- Open WebUI database pool size
      size: 15
      # -- Open WebUI database pool max overflow
      maxOverflow: 20
  postgresql:
    auth:
      # -- postgres password
      postgresPassword:
      # @ignored
      username: openwebui
      # -- openwebui user password
      password:
      # @ignored
      database: openwebui
    # @ignored
    fullnameOverride: open-webui-postgresql
    # -- Max PostgreSQL connections
    maxConnections: 200
    # @ignored
    service:
      ports:
        postgresql: 5432
  redis:
    # -- Redis password
    password:
    # -- Redis max clients
    maxclients: 10000
    # -- Redis client timeout
    timeout: 1800
# @ignored
clusterDomain: cluster.local

ollama:
  networkPolicy:
    # -- Array of additional pod labels to allow
    allowedPodLabels: []

database:
  # @ignored
  oscCommon:
    enable: false
  postgresql:
    # -- Enable postgresql
    enable: true
    # @ignored
    primary:
      extendedConfiguration: |
        max_connections = {{ .Values.global.postgresql.maxConnections }}
      persistence:
        annotations:
          osc.edu/fileset: '{{ .Values.global.fileset }}'
    # @ignored
    backup:
      cronjob:
        annotations:
          osc.edu/fileset: '{{ .Values.global.fileset }}'
  redis:
    # @ignored
    enable: true
    # @ignored
    fullnameOverride: open-webui-redis
    # @ignored
    auth:
      enabled: true
    # @ignored
    commonConfiguration: |-
      # Enable AOF https://redis.io/topics/persistence#append-only-file
      appendonly yes
      # Disable RDB persistence, AOF persistence already enabled.
      save ""
      # Recommended by Open WebUI
      maxclients {{ .Values.global.redis.maxclients }}
      timeout {{ .Values.global.redis.timeout }}
    master:
      service:
        ports:
          # Must match REDIS_URL port for Open WebUI
          # @ignored
          redis: 6379
      persistence:
        annotations:
          # -- Fileset for Redis storage
          osc.edu/fileset: PZS0645
    # @ignored
    networkPolicy:
      ingressNSPodMatchLabels:
        app.kubernetes.io/name: open-webui

open-webui:
  # @ignored
  fullnameOverride: open-webui
  # @ignored
  nameOverride: open-webui
  # @ignored
  openaiApiKey: false
  # @ignored
  pipelines:
    enabled: false
  # @ignored
  websocket:
    enabled: false
  # @ignored
  extraLabels:
    '{{ include "osc.common.serviceAccountKey" . }}': '{{ include "osc.common.serviceAccountValue" . }}'
    keycloak.osc.edu/keycloakclient: '{{ .Release.Name }}'
    receiver: '{{ .Values.global.alert.receiver }}'
  # @ignored
  podLabels:
    '{{ include "osc.common.serviceAccountKey" . }}': '{{ include "osc.common.serviceAccountValue" . }}'
    receiver: '{{ .Values.global.alert.receiver }}'
  # @ignored
  podAnnotations:
    checksum/secret: '{{ include "osc-open-webui.secret.content" . | sha256sum }}'
    checksum/db-migrate: '{{ include "osc-open-webui.db-migrate.content" . | sha256sum }}'
    checksum/db-wait: '{{ include "osc-open-webui.db-wait.content" . | sha256sum }}'
  image:
    # -- OSC registry location for Open WebUI image
    repository: docker-registry.osc.edu/kubernetes/open-webui/open-webui
    # -- The Open WebUI image tag.  Must be synced to OSC registry
    tag: 0.11.4
  # @ignored
  imagePullSecrets:
    - name: '{{ .Values.global.imagePullSecret.name }}'
  resources:
    limits:
      # -- Open WebUI pod memory limit
      memory: 4Gi
      # -- Open WebUI pod CPU limit
      cpu: 2
    requests:
      # -- Open WebUI pod memory request
      memory: 2Gi
      # -- Open WebUI pod CPU request
      cpu: 1
  # @ignored
  copyAppData:
    resources:
      limits:
        memory: 1Gi
        cpu: 1
      requests:
        memory: 500Mi
        cpu: 500m
  # @ignored
  ingress:
    enabled: false
  persistence:
    # @ignored
    labels:
      '{{ include "osc.common.serviceAccountKey" . }}': '{{ include "osc.common.serviceAccountValue" . }}'
    # @ignored
    annotations:
      osc.edu/fileset: '{{ .Values.global.fileset }}'
    # @ignored
    size: 10Gi
    # -- The Open WebUI persistent storage class
    storageClass: '{{ .Values.global.storageClass }}'
  # @ignored
  nodeSelector:
    '{{ include "osc.common.nodeSelectorRoleKey" . }}': ''
  # -- Additional Open WebUI environment variables
  extraEnvVars: []
  # @ignored
  commonEnvVars:
    - name: K8S_NAMESPACE
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: metadata.namespace
    - name: ENABLE_DB_MIGRATIONS
      value: '{{ if .Values.global.database.enable }}False{{ else }}True{{ end }}'
    # - name: DATABASE_TYPE
    #   value: '{{ if .Values.global.database.enable }}postgresql{{ else }}sqlite{{ end }}'
    # - name: DATABASE_USER
    #   value: '{{ if .Values.global.database.enable }}{{ .Values.global.postgresql.auth.username }}{{ else }}None{{ end }}'
    # - name: DATABASE_PASSWORD
    #   value: '{{ if .Values.global.database.enable }}{{ .Values.global.postgresql.auth.password }}{{ else }}None{{ end }}'
    # - name: DATABASE_HOST
    #   value: '{{ if .Values.global.database.enable }}{{ printf "%s.%s.svc.%s" .Values.global.postgresql.fullnameOverride .Release.Namespace .Values.clusterDomain }}{{ else }}None{{ end }}'
    # - name: DATABASE_PORT
    #   value: '{{ if .Values.global.database.enable }}{{ .Values.global.postgresql.service.ports.postgresql }}{{ else }}None{{ end }}'
    # - name: DATABASE_NAME
    #   value: '{{ if .Values.global.database.enable }}{{ .Values.global.postgresql.auth.database }}{{ else }}None{{ end }}'
    - name: DATABASE_POOL_SIZE
      value: '{{ .Values.global.database.pool.size }}'
    - name: DATABASE_POOL_MAX_OVERFLOW
      value: '{{ .Values.global.database.pool.maxOverflow }}'
    - name: WEBSOCKET_MANAGER
      value: '{{ if .Values.global.database.enable }}redis{{ end }}'
    # TODO: Add 'tpl' upstream to what builds REDIS_URL
    # - name: REDIS_URL
    #   value: '{{ if .Values.global.database.enable }}redis://:{{ .Values.global.redis.password }}@open-webui-redis-master.{{ .Release.Namespace }}.svc.{{ .Values.clusterDomain }}:6379/0{{ end }}'
    - name: LOG_FORMAT
      value: json
    - name: ENABLE_OAUTH_GROUP_CREATION
      value: "True"
    - name: DEFAULT_USER_ROLE
      value: user
    - name: ENABLE_SIGNUP
      value: "True"
    - name: ENABLE_OAUTH_SIGNUP
      value: "True"
    - name: ENABLE_LOGIN_FORM
      value: "False"
    - name: WEBUI_AUTH
      value: "True"
    - name: ENABLE_VERSION_UPDATE_CHECK
      value: "False"
    - name: ENABLE_API_KEYS
      value: "True"
    - name: USER_PERMISSIONS_FEATURES_API_KEYS
      value: "True"
    - name: ENABLE_AUDIT_STDOUT
      value: "True"
    - name: AUDIT_LOG_LEVEL
      value: METADATA
    - name: ENABLE_OTEL
      value: "True"
    - name: ENABLE_OTEL_METRICS
      value: "True"
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: http://otel-collector.{{ .Release.Namespace }}.svc.{{ .Values.clusterDomain }}:4317
    - name: OTEL_EXPORTER_OTLP_INSECURE
      value: "True"
  # @ignored
  extraEnvFrom:
    - secretRef:
        name: osc-open-webui-secret
  # @ignored
  extraInitContainers: |
    - name: db-wait
      image: 'docker-registry.osc.edu/kubernetes/portainer/kubectl-shell:2.39.0'
      imagePullPolicy: '{{ .Values.image.pullPolicy }}'
      command:
        - /bin/bash
        - /scripts/db-wait.sh
      resources:
        {{- toYaml .Values.global.init.resources | nindent 4 }}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
        privileged: false
      volumeMounts:
        - name: scripts
          mountPath: /scripts
          readOnly: true
    - name: db-migrate
      image: '{{ .Values.image.repository }}:{{ include "open-webui.tag" $ }}'
      imagePullPolicy: '{{ .Values.image.pullPolicy }}'
      command:
        - /bin/bash
        - /scripts/db-migrate.sh
      resources:
        {{- toYaml .Values.global.init.resources | nindent 4 }}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
        privileged: false
      env:
        - name: POD_INDEX
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['apps.kubernetes.io/pod-index']
      envFrom:
        - secretRef:
            name: osc-open-webui-secret
      volumeMounts:
        - name: scripts
          mountPath: /scripts
          readOnly: true
        - name: data
          mountPath: /app/backend/data
  # @ignored
  volumes:
    - name: scripts
      configMap:
        name: osc-open-webui-scripts
  # @ignored
  serviceAccount:
    automountServiceAccountToken: true
  # @ignored
  service:
    port: 80
    labels:
      receiver: '{{ .Values.global.alert.receiver }}'
    annotations:
      prometheus.io/probe_module: http
      prometheus.io/probe_scheme: http
      prometheus.io/probe_path: /health
  # @ignored
  podSecurityContext:
    runAsNonRoot: true
  # @ignored
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    seccompProfile:
      type: RuntimeDefault
    privileged: false
  # @ignored
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 30
    failureThreshold: 3
    periodSeconds: 10
  # @ignored
  readinessProbe:
    httpGet:
      path: /health/db
      port: http
    initialDelaySeconds: 30
    failureThreshold: 3
    periodSeconds: 10
  # @ignored
  startupProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 5
    failureThreshold: 20
  sso:
    # @ignored
    enabled: true
    # @ignored
    mergeAccountsByEmail: true
    # -- Enables role access controls in Open WebUI
    enableRoleManagement: false
    # @ignored
    enableGroupManagement: true
    # @ignored
    oidc:
      enabled: true
      clientExistingSecret: '{{ tpl .Values.global.auth.keycloakClient.secret.name . }}'
      clientIdExistingSecretKey: client-id
      clientExistingSecretKey: client-secret
      existingConfig: '{{ tpl .Values.global.auth.keycloakClient.configmap.name . }}'
      existingConfigProviderUrlKey: PROVIDER_URL
      providerName: "OSC SSO"
      scopes: "openid email profile groups basic osc-oidc-clients"
    # @ignored
    roleManagement:
      rolesClaim: groups
      allowedRoles: '{{- if .Values.sso.enableRoleManagement }}{{ required "Allowed groups required when role management enabled" .Values.global.auth.allowGroups | join "," }}{{- end }}'
      adminRoles: sysstf,sappstf
    # @ignored
    trustedHeader:
      enabled: false
  ollama:
    # Added so can be referenced
    # @ignored
    nameOverride: ollama
    # @ignored
    fullnameOverride: ollama
    image:
      repository: docker-registry.osc.edu/kubernetes/ollama/ollama
      tag: '0.16.1'
    imagePullSecrets:
      - name: osc-registry
    ollama:
      gpu:
        enabled: true
        type: nvidia
        # Example requesting specific MIG
        # nvidiaResource: nvidia.com/mig-7g.40gb
        number: 1
    # @ignored
    nodeSelector:
      node-role.kubernetes.io/webservices: ''
    service:
      annotations:
        prometheus.io/probe_module: http
        prometheus.io/probe_scheme: http
    deployment:
      labels: {}
      # Example labels
      # labels:
      #   osc.edu/service-account: TODO
    podLabels: {}
    # Example labels
    # podLabels:
    #   osc.edu/service-account: TODO
    podSecurityContext:
      runAsNonRoot: true
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      seccompProfile:
        type: RuntimeDefault
      privileged: false
    resources:
      limits:
        memory: 16Gi
        cpu: 8
      requests:
        memory: 4Gi
        cpu: 2
    # @ignored
    initContainers:
      - name: create-dirs
        image: docker-registry.osc.edu/kubernetes/busybox:latest
        imagePullPolicy: Always
        command: ['sh', '-c', 'mkdir -p /data/ollama-models /home/ollama/ollama-home']
        volumeMounts:
          - name: data
            mountPath: /data
          - name: home
            mountPath: /home/ollama
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
          privileged: false
        resources:
          limits:
            memory: 1Gi
            cpu: 1
          requests:
            memory: 265Mi
            cpu: 200m
    volumes: []
    # Example ESS mount
    # volumes:
    # - name: data
    #   hostPath:
    #     path: /fs/ess/TODO
    #     type: Directory
    # - name: home
    #   hostPath:
    #     path: /users/PROJECT/USER
    #     type: Directory
    volumeMounts:
      - name: data
        mountPath: /data
        subPath: ollama-models
      - name: home
        mountPath: /home/ollama
        subPath: ollama-home
    extraEnv:
      - name: OLLAMA_MODELS
        value: /data
      - name: HOME
        value: /home/ollama
      - name: OLLAMA_FLASH_ATTENTION
        value: '1'

oscCommon:
  # -- Enable the osc-common dependency
  enable: true

opentelemetry-collector:
  # @ignored
  nameOverride: otel-collector
  # @ignored
  fullnameOverride: otel-collector
  # @ignored
  mode: deployment
  image:
    # @ignored
    repository: kubernetes/otel/opentelemetry-collector-contrib
    # -- otel collector image, must match what's replicated to OSC
    tag: 0.161.0
  # @ignored
  imagePullSecrets:
    - name: '{{ .Values.global.imagePullSecret.name }}'
  # @ignored
  resources:
    limits:
      cpu: 2
      memory: 512Mi
    requests:
      cpu: 500m
      memory: 64Mi
  # @ignored
  podSecurityContext:
    runAsNonRoot: true
  # @ignored
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    seccompProfile:
      type: RuntimeDefault
    privileged: false
  # @ignored
  nodeSelector:
    '{{ include "osc.common.nodeSelectorRoleKey" . }}': ''
  # @ignored
  additionalLabels:
    '{{ include "osc.common.serviceAccountKey" . }}': '{{ include "osc.common.serviceAccountValue" . }}'
    receiver: '{{ .Values.global.alert.receiver }}'
  # @ignored
  ports:
    jaeger-compact:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    zipkin:
      enabled: false
    metrics:
      enabled: true
    prometheus:
      enabled: true
      containerPort: 8889
      servicePort: 8889
      protocol: TCP
  # @ignored
  serviceMonitor:
    enabled: true
    metricsEndpoints:
      - port: metrics
        interval: 10s
      - port: prometheus
        interval: 10s
    relabelings:
      - sourceLabels: [__meta_kubernetes_service_label_receiver]
        targetLabel: receiver
  # @ignored
  networkPolicy:
    enabled: true
    allowIngressFrom:
      - podSelector: {}
      - namespaceSelector:
          matchLabels:
            app.kubernetes.io/name: '{{ .Values.global.networkPolicy.prometheusNamespace }}'
  # @ignored
  config:
    receivers:
      jaeger: ~
      prometheus: ~
      zipkin: ~
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:{{ .Values.ports.otlp.containerPort }}
          http:
            endpoint: ${env:MY_POD_IP}:{{ index .Values.ports "otlp-http" "containerPort" }}
    processors:
      batch: {}
      transform/add_prefix:
        error_mode: ignore
        metric_statements:
          - context: metric
            statements:
              # Prepends "open.webui." to every metric name passing through this processor except osc metrics
              - set(metric.name, Concat(["open.webui", metric.name], ".")) where not IsMatch(metric.name, "^(osc|dynamo).*") and resource.attributes["service.name"] == "open-webui"
    exporters:
      debug: ~
      prometheus:
        endpoint: ${env:MY_POD_IP}:{{ .Values.ports.prometheus.containerPort }}
    service:
      telemetry:
        resource: ~
        logs:
          level: warn
      pipelines:
        logs: ~
        traces: ~
        metrics:
          receivers: [otlp]
          processors: [transform/add_prefix, batch]
          exporters: [prometheus]
