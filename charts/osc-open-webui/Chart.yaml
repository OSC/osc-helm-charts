apiVersion: v2
name: osc-open-webui
description: OSC Open Web UI deployment
type: application
version: 0.10.0
appVersion: "0.1.0"
maintainers:
  - name: treydock
dependencies:
  - name: osc-common
    version: 0.15.1
    repository: https://osc.github.io/osc-helm-charts/
    # repository: file://../osc-common
    condition: oscCommon.enable
  - name: database
    version: 0.19.6
    repository: https://osc.github.io/osc-helm-charts
    # repository: file://../database
    condition: global.database.enable
  - name: open-webui
    # version: 13.1.0
    # repository: https://helm.openwebui.com/
    # Use OCI until merged and released:
    #
    #   helm package charts/open-webui --version 16.7.0-osc-r0
    #   helm push open-webui-16.7.0-osc-r0.tgz oci://docker-registry.osc.edu/kubernetes/open-webui
    version: 16.7.0-osc-r0
    repository: oci://docker-registry.osc.edu/kubernetes/open-webui
