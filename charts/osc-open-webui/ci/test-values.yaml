global:
  oscServiceAccount: nobody
  imagePullSecret:
    password: IMAGE-PULL-PASSWORD
  nodeSelectorRole: test
  auth:
    allowGroups:
      - test1
      - test2
    redirectUris:
      - /oauth/oidc/callback
  ingress:
    host: webservice.k8.example.com
    hostAlias: webservice.example.com
    additionalHosts:
      - '*.service.example.com'
  webui_secret_key: supersecret
  alert:
    receiver: test-receiver
  maintenance:
    groups:
      - testgroup
ollama:
  networkPolicy:
    allowedPodLabels:
      - app.kubernetes.io/name: ollama

open-webui:
  persistence:
    storageClass: standard
    size: 50Mi
  resources:
    limits:
      memory: 1Gi
      cpu: 2
    requests:
      memory: 512Mi
      cpu: 1
  podSecurityContext:
    runAsUser: 1000
  livenessProbe:
    initialDelaySeconds: 60
  readinessProbe:
    initialDelaySeconds: 60
  startupProbe:
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 30
  sso:
    enableRoleManagement: true
  ollama:
    ollama:
      gpu:
        enabled: false
    deployment:
      labels:
        osc.edu/service-account: nobody
    podLabels:
      osc.edu/service-account: nobody
    resources:
      limits:
        memory: 500Mi
        cpu: 1
      requests:
        memory: 200Mi
        cpu: 500m
    podSecurityContext:
      runAsUser: 1000
    initContainers: []
    volumes: []
    volumeMounts: []
    extraEnv: []
