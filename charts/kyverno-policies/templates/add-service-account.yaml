apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: add-service-account
spec:
  validationFailureAction: Enforce
  background: true
  rules:
  - name: webservice-add-service-account
    match:
      any:
        - resources:
            kinds:
            - Pod
            - DaemonSet
            - Deployment
            - Job
            - ReplicaSet
            - ReplicationController
            - StatefulSet
            - CronJob
            namespaceSelector:
              matchLabels:
                osc.edu/role: webservice
                osc.edu/service-account: "*?"
            operations:
            - CREATE
            - UPDATE
    preconditions:
    - key: "{{`{{ serviceAccount || '' }}`}}"
      operator: NotEquals
      value: ""
    context:
    - name: serviceAccount
      apiCall:
        urlPath: "/api/v1/namespaces/{{`{{ request.namespace }}`}}"
        jmesPath: "metadata.labels.\"{{ include "osc.common.serviceAccountKey" . }}\" || ''"
    mutate:
      patchStrategicMerge:
        metadata:
          labels:
            '{{ include "osc.common.serviceAccountKey" . }}': '{{`{{ serviceAccount }}`}}'
  - name: webservice-service-account-run-as
    match:
      any:
        - resources:
            kinds:
            - Pod
            namespaceSelector:
              matchExpressions:
              - key: osc.edu/role
                operator: In
                values:
                - webservice
            operations:
            - CREATE
            - UPDATE
    preconditions:
    - key: "{{`{{ serviceAccount || '' }}`}}"
      operator: NotEquals
      value: ""
    context:
    - name: namespaceServiceAccount
      apiCall:
        urlPath: "/api/v1/namespaces/{{`{{ request.namespace }}`}}"
        jmesPath: "metadata.labels.\"{{ include "osc.common.serviceAccountKey" . }}\" || ''"
    - name: serviceAccount
      variable:
        jmesPath: "request.object.metadata.labels.\"{{ include "osc.common.serviceAccountKey" . }}\" || namespaceServiceAccount"
    - name: uidMap
      configMap:
        name: user-uid-map
        namespace: k8-ldap-configmap
    - name: gidMap
      configMap:
        name: user-gid-map
        namespace: k8-ldap-configmap
    - name: gidsMap
      configMap:
        name: user-gids-map
        namespace: k8-ldap-configmap
    mutate:
      foreach:
      - list: "request.object.spec"
        patchStrategicMerge:
          spec:
            securityContext:
              runAsNonRoot: true
              runAsUser: "{{`{{ uidMap.data.\"user-{{ serviceAccount }}\".to_number(@) }}`}}"
              runAsGroup: "{{`{{ gidMap.data.\"user-{{ serviceAccount }}\".to_number(@) }}`}}"
              fsGroup: "{{`{{ gidMap.data.\"user-{{ serviceAccount }}\".to_number(@) }}`}}"
              supplementalGroups: "{{`{{ gidsMap.data.\"user-{{ serviceAccount }}\" | parse_json(@)[*].to_number(@) }}`}}"
      - list: "request.object.spec.[containers, initContainers][]"
        patchStrategicMerge:
          spec:
            containers:
            - (name): "*"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                seccompProfile:
                  type: RuntimeDefault
                privileged: false
            initContainers:
            - (name): "*"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                seccompProfile:
                  type: RuntimeDefault
                privileged: false
      - list: "request.object.spec.initContainers || []"
        preconditions:
          any:
            - key: "{{`{{ element.securityContext.runAsUser || '' }}`}}"
              operator: NotEquals
              value: ""
        patchesJson6902: |-
          - op: replace
            path: /spec/initContainers/{{`{{ elementIndex }}`}}/securityContext/runAsUser
            value: {{`{{ uidMap.data."user-{{ serviceAccount }}".to_number(@) }}`}}
      - list: "request.object.spec.initContainers || []"
        preconditions:
          any:
            - key: "{{`{{ element.securityContext.runAsGroup || '' }}`}}"
              operator: NotEquals
              value: ""
        patchesJson6902: |-
          - op: replace
            path: /spec/initContainers/{{`{{ elementIndex }}`}}/securityContext/runAsGroup
            value: {{`{{ gidMap.data."user-{{ serviceAccount }}".to_number(@) }}`}}
      - list: "request.object.spec.containers || []"
        patchStrategicMerge:
          spec:
            containers:
            - (name): "*"
              securityContext:
                (runAsUser): "?*"
                runAsUser: "{{`{{ uidMap.data.\"user-{{ serviceAccount }}\".to_number(@) }}`}}"
      - list: "request.object.spec.containers || []"
        patchStrategicMerge:
          spec:
            containers:
            - (name): "*"
              securityContext:
                (runAsGroup): "?*"
                runAsGroup: "{{`{{ gidMap.data.\"user-{{ serviceAccount }}\".to_number(@) }}`}}"
