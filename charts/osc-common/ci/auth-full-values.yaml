global:
  oscServiceAccount: test
  imagePullSecret:
    password: IMAGE-PULL-PASSWORD
  auth:
    upstream: http://{{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local:80
    skipAuthRoutes:
      - '/api($|/.*)'
      - '^/ollama($|/.*)'
      - '^/docs($|/.*)'
    allowGroups:
      - group1
      - group2
      - '{{ .Values.global.project }}'
    redirectUris:
      - /oauth/oidc/callback
  ingress:
    host: test.example.com
    additionalHosts:
      - '*.{{ .Values.global.ingress.host }}'
  project: test1
keycloakClient:
  config:
    webOrigins:
      - https://{{ .Values.global.ingress.host }}
      - '{{ printf "https://%s" (.Values.global.ingress.hostAlias | default .Values.global.ingress.host) }}'
oauth2-proxy:
  enable: true
