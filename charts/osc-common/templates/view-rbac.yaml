{{- if and .Values.global.viewGroups .Values.rbac.create }}
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: '{{ include "osc.common.name" . }}-view-secrets'
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "osc.common.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: '{{ include "osc.common.name" . }}-view-secrets'
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "osc.common.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: '{{ include "osc.common.name" . }}-view-secrets'
subjects:
{{- range .Values.global.viewGroups }}
  - kind: Group
    name: {{ . | quote }}
    apiGroup: rbac.authorization.k8s.io
{{- end }}
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: '{{ include "osc.common.name" . }}-view'
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "osc.common.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
{{- range .Values.global.viewGroups }}
  - kind: Group
    name: {{ . | quote }}
    apiGroup: rbac.authorization.k8s.io
{{- end }}
{{ end }}
