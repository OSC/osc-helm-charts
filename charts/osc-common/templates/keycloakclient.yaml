{{- if or .Values.global.auth.enable .Values.global.auth.keycloakClient.forceCreate }}
apiVersion: keycloak.osc.edu/v1alpha1
kind: KeycloakClient
metadata:
  labels:
    {{- include "osc.common.labels" . | nindent 4 }}
  name: {{ include "osc.common.name" . | quote }}
spec:
  {{- if and .Values.keycloakClient.useGlobal (or (default "" ((((.Values).global).ingress).host)) (default "" ((((.Values).global).ingress).hostAlias)) (default list ((((.Values).global).auth).redirectUris))) }}
  redirectUris:
    - https://{{ tpl .Values.global.ingress.host . }}{{ .Values.global.auth.redirectUriPath }}
  {{- if .Values.global.ingress.hostAlias }}
    - https://{{ tpl .Values.global.ingress.hostAlias . }}{{ .Values.global.auth.redirectUriPath }}
  {{- end }}
  {{- range (default list ((((.Values).global).ingress).additionalHosts)) }}
    - https://{{ tpl . $ }}{{ $.Values.global.auth.redirectUriPath }}
  {{- end }}
  {{- end }}
  {{- range (default list ((((.Values).global).auth).redirectUris)) }}
    - {{ tpl . $ | quote }}
  {{- end }}
  {{- if and (not .Values.keycloakClient.useGlobal) .Values.keycloakClient.redirectUris }}
  redirectUris:
  {{- range .Values.keycloakClient.redirectUris }}
    - {{ tpl . $ | quote }}
  {{- end }}
  {{- end }}
  defaultClientScopes:
  {{- range .Values.global.auth.defaultClientScopes }}
    - {{ . }}
  {{- end }}
  {{- range .Values.global.auth.extraDefaultClientScropes }}
    - {{ . }}
  {{- end }}
  {{- $config := .Values.keycloakClient.config | default .Values.global.auth.keycloakClient.config }}
  {{- if $config }}
  {{- tpl (toYaml $config) . | nindent 2 }}
  {{- end }}
  clientSecretRef:
    name: {{ tpl .Values.keycloakClient.secret.name . }}
    key: client-secret
    create: true
    envVarKeys: false
  configMap:
    name: {{ tpl .Values.keycloakClient.configmap.name . }}
    envVarKeys: true
{{- end }}
