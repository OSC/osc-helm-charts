global:
  oscServiceAccount: nobody
  imagePullSecret:
    create: true
    password: IMAGE-PULL-PASSWORD
  ingress:
    minio:
      api: test-api.example.com
      console: test-minio-console.example.com
  storageClass: standard
osc-common:
  imagePullSecret:
    create: true
minio:
  resources:
    limits:
      cpu: 1
      memory: 128Mi
    requests:
      cpu: 250m
      memory: 64Mi
  persistence:
    accessModes:
    - ReadWriteOnce
    size: 50Mi
  console:
    resources:
      limits:
        cpu: 1
        memory: 128Mi
      requests:
        cpu: 250m
        memory: 64Mi
