global:
  oscServiceAccount: nobody
  imagePullSecret:
    create: true
    password: IMAGE-PULL-PASSWORD
  ingress:
    silo:
      api: test-api.example.com
      console: test-silo-console.example.com
  storageClass: standard
osc-common:
  imagePullSecret:
    create: true
silo:
  resources:
    limits:
      cpu: 1
      memory: 128Mi
    requests:
      cpu: 250m
      memory: 64Mi
  persistence:
    accessMode: ReadWriteOnce
    size: 50Mi
  buckets:
    - name: mybucket
      policy: none
      purge: false
      versioning: false
      objectlocking: false
