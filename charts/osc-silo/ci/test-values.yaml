global:
  oscServiceAccount: nobody
  imagePullSecret:
    create: true
    password: IMAGE-PULL-PASSWORD
  ingress:
    silo:
      api: test-api.example.com
      console: test-silo-console.example.com
  storageClass: standard
  silo:
    defaultBucket: test
    policies:
      - name: testing-admin
        statements:
          - effect: Allow
            actions:
              - 's3:*'
            resources:
              - 'arn:aws:s3:::*'
            conditions:
              - ForAnyValue:StringEquals: '"jwt:groups": "admin"'
osc-common:
  imagePullSecret:
    create: true
silo:
  resources:
    limits:
      cpu: 1
      memory: 128Mi
    requests:
      cpu: 250m
      memory: 64Mi
  persistence:
    accessMode: ReadWriteOnce
    size: 50Mi
