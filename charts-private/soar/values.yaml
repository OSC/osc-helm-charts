global:
  # @ignored
  oscServiceAccount: soar
  # -- Groups that debug pods
  debugGroups:
    - sappstf
  # -- Groups that can perform maintenance operations
  maintenanceGroups:
    - sappstf
  auth:
    # @ignored
    enable: true
    allowGroups:
      - PDE0043
      - sappstf
  alert:
    # Also pulled from global.env.$environment.alert.receiver
    receiver: sciapps
  imageTag: v1.3.0-1
  env:
    production:
      image:
        tag: '{{ .Values.global.imageTag }}'
    test:
      image:
        tag: '{{ .Values.global.imageTag }}'
    dev:
      image:
        tag: latest
webservice:
  appType: rshiny
  workingDir: /app
  image:
    repository: docker-registry.osc.edu/webservices/soar
  mounts:
    rwDir:
      ess: /fs/ess/PDE0043
