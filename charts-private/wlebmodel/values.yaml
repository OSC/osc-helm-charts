global:
  # @ignored
  oscServiceAccount: wlebmodel
  # -- Groups that debug pods
  debugGroups:
    - sappstf
  # -- Groups that can perform maintenance operations
  maintenanceGroups:
    - sappstf
  auth:
    # @ignored
    enable: true
    allowGroups:
      - PAS3457
      - sappstf
  alert:
    # Also pulled from global.env.$environment.alert.receiver
    receiver: sciapps
  imageTag: v2.7.2-1
  env:
    production:
      image:
        tag: '{{ .Values.global.imageTag }}'
    test:
      image:
        tag: '{{ .Values.global.imageTag }}'
    dev:
      image:
        tag: latest
webservice:
  appType: rshiny
  workingDir: /app
  image:
    repository: docker-registry.osc.edu/webservices/wlebmodel
  env:
  - name: SLURM_CONF
    value: '/etc/slurm/slurm-pitzer.conf'
  mounts:
    rwDir:
      ess: /fs/ess/PAS3457
      scratch: /fs/scratch/PAS3457
    roDir:
      slurm-conf: /etc/slurm
    socket:
      munge-socket: /var/run/munge/munge.socket.2
